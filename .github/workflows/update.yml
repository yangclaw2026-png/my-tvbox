name: Update TVBox Config

on:
  schedule:
    - cron: '0 2 */3 * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install deps
        run: pip install requests
      
      - name: Crawl CMS sites
        run: python scripts/crawl_sites.py
      
      - name: Fetch ratings
        run: python scripts/fetch_rating.py
      
      - name: Generate config
        run: python scripts/generate_tvbox.py
      
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: update $(date -u +%Y-%m-%d)"
          git push
